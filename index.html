
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administración de Usuarios</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #edf2f7;
            margin: 20px;
        }

        .contenedor {
            max-width: 950px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h2, h3 {
            color: #2457a7;
        }

        input {
            padding: 10px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button, .salir {
            padding: 10px 15px;
            background: #2457a7;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .salir {
            display: inline-block;
            text-decoration: none;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #2457a7;
            color: white;
        }

        .tabla {
            overflow-x: auto;
        }

        .eliminar {
            background: #c0392b;
        }
    </style>
</head>
<body>

<div class="contenedor">

    <h2>Administración de Usuarios</h2>

    <a href="/salir" class="salir">Cerrar sesión</a>

    <h3>Formulario de Usuarios</h3>

    <form id="formUsuario">

        <input type="hidden" id="idUsuario">

        <input type="text" id="usuario"
               placeholder="Usuario" maxlength="35" required>

        <input type="password" id="clave"
               placeholder="Contraseña para nuevo usuario"
               maxlength="35">

        <input type="text" id="nombre"
               placeholder="Nombre completo" maxlength="85" required>

        <input type="text" id="direccion"
               placeholder="Dirección" maxlength="100" required>

        <input type="tel" id="telefono"
               placeholder="Teléfono" maxlength="9" required>

        <button type="submit">Guardar</button>

        <button type="button" onclick="limpiar()">
            Limpiar
        </button>

    </form>

    <p id="mensaje"></p>

    <h3>Listado de Usuarios</h3>

    <input type="text" id="filtro"
           placeholder="Buscar usuario"
           oninput="filtrarUsuarios()">

    <div class="tabla">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Nombre</th>
                    <th>Dirección</th>
                    <th>Teléfono</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody id="listaUsuarios"></tbody>
        </table>
    </div>

</div>

<script src="/app.js"></script>

</body>
</html>
