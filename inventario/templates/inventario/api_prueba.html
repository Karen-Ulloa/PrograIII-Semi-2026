<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba de API · CampesinoStock</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    pre#salida { background:#1e1e1e; color:#d4d4d4; padding:1rem; border-radius:.5rem;
                 max-height:55vh; overflow:auto; font-size:.85rem; white-space:pre-wrap; }
    textarea { font-family: ui-monospace, Consolas, monospace; font-size:.85rem; }
  </style>
</head>
<body class="bg-light">
<div class="container py-3" style="max-width:900px">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h1 class="h4 mb-0">Prueba de API REST</h1>
      <small class="text-muted">Sesión: {{ nombre }} · Rol: <strong>{{ rol }}</strong></small>
    </div>
    <a class="btn btn-outline-secondary btn-sm" href="{% url 'dashboard' %}">Volver al sistema</a>
  </div>

  <div class="card shadow-sm mb-3"><div class="card-body">
    <label class="form-label fw-semibold">Ejemplo rápido</label>
    <select id="ejemplo" class="form-select mb-3"></select>

    <div class="row g-2 mb-3">
      <div class="col-4 col-md-2">
        <select id="metodo" class="form-select">
          <option>GET</option><option>POST</option><option>PUT</option>
          <option>PATCH</option><option>DELETE</option>
        </select>
      </div>
      <div class="col-8 col-md-10">
        <input id="url" class="form-control" value="/api/v1/catalogos/">
      </div>
    </div>

    <label class="form-label fw-semibold">Cuerpo (JSON, para POST / PUT / PATCH)</label>
    <textarea id="cuerpo" class="form-control mb-3" rows="6"></textarea>

    <button id="enviar" class="btn btn-success">Enviar petición</button>
  </div></div>

  <div class="d-flex align-items-center gap-2 mb-2">
    <span class="fw-semibold">Respuesta</span>
    <span id="estado" class="badge text-bg-secondary">—</span>
    <small id="tiempo" class="text-muted"></small>
  </div>
  <pre id="salida">Elige un ejemplo y pulsa "Enviar petición".</pre>
</div>

{% verbatim %}
<script>
const EJEMPLOS = [
  {t:'Catálogos (ids de categorías, métodos de pago, motivos)', m:'GET', u:'/api/v1/catalogos/'},
  {t:'Productos: listar', m:'GET', u:'/api/v1/productos/'},
  {t:'Productos: buscar por texto', m:'GET', u:'/api/v1/productos/?q=cemento'},
  {t:'Productos: solo en alerta de stock', m:'GET', u:'/api/v1/productos/?alerta=1'},
  {t:'Productos: ver uno', m:'GET', u:'/api/v1/productos/1/'},
  {t:'Productos: crear', m:'POST', u:'/api/v1/productos/',
   b:{nombre_producto:'Producto de prueba API', id_categoria:1, precio_compra:'1.00', precio_producto:'1.50', stock:10, stock_minimo:3}},
  {t:'Productos: editar parcial', m:'PATCH', u:'/api/v1/productos/1/', b:{stock_minimo:5}},
  {t:'Productos: eliminar', m:'DELETE', u:'/api/v1/productos/1/'},
  {t:'Clientes: listar (solo Admin)', m:'GET', u:'/api/v1/clientes/'},
  {t:'Clientes: crear (solo Admin)', m:'POST', u:'/api/v1/clientes/', b:{nombre:'Cliente de Prueba', telefono:'7000-0000'}},
  {t:'Proveedores: listar (Admin y Encargado)', m:'GET', u:'/api/v1/proveedores/'},
  {t:'Proveedores: crear', m:'POST', u:'/api/v1/proveedores/', b:{nombre_proveedor:'Proveedor de Prueba', contacto_proveedor:'2200-0000'}},
  {t:'Ventas: listar (?periodo=hoy|semana|todas)', m:'GET', u:'/api/v1/ventas/?periodo=hoy'},
  {t:'Ventas: registrar', m:'POST', u:'/api/v1/ventas/', b:{id_metodo_pago:1, lineas:[{id_producto:1, cantidad:1}]}},
  {t:'Ventas: registrar con cliente (solo Admin)', m:'POST', u:'/api/v1/ventas/', b:{id_cliente:1, id_metodo_pago:1, lineas:[{id_producto:1, cantidad:1}]}},
  {t:'Mermas: listar', m:'GET', u:'/api/v1/mermas/?periodo=semana'},
  {t:'Mermas: registrar', m:'POST', u:'/api/v1/mermas/', b:{id_producto:1, id_motivo:1, cantidad:1}},
  {t:'Mermas: anular (solo Admin, devuelve stock)', m:'DELETE', u:'/api/v1/mermas/1/'},
  {t:'Órdenes de compra: listar', m:'GET', u:'/api/v1/ordenes-compra/?estado=Pendiente'},
  {t:'Órdenes de compra: crear', m:'POST', u:'/api/v1/ordenes-compra/', b:{id_proveedor:1, lineas:[{id_producto:1, cantidad:5, precio_compra:'1.00'}]}},
  {t:'Órdenes de compra: recibir', m:'POST', u:'/api/v1/ordenes-compra/1/recibir/'},
  {t:'Órdenes de compra: cancelar', m:'POST', u:'/api/v1/ordenes-compra/1/cancelar/'},
];

const $ = id => document.getElementById(id);
const sel = $('ejemplo');
EJEMPLOS.forEach((e, i) => sel.add(new Option(`${e.m}  ·  ${e.t}`, i)));

function cargar(i) {
  const e = EJEMPLOS[i];
  $('metodo').value = e.m;
  $('url').value = e.u;
  $('cuerpo').value = e.b ? JSON.stringify(e.b, null, 2) : '';
}
sel.addEventListener('change', () => cargar(sel.value));
cargar(0);

function csrf() {
  const m = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);
  return m ? decodeURIComponent(m[1]) : '';
}

$('enviar').addEventListener('click', async () => {
  const metodo = $('metodo').value;
  const opciones = {method: metodo, credentials: 'same-origin',
                    headers: {'Accept': 'application/json', 'X-CSRFToken': csrf()}};
  const texto = $('cuerpo').value.trim();
  if (texto && metodo !== 'GET' && metodo !== 'DELETE') {
    try { JSON.parse(texto); } catch (err) {
      $('estado').className = 'badge text-bg-danger';
      $('estado').textContent = 'JSON inválido';
      $('salida').textContent = String(err);
      return;
    }
    opciones.headers['Content-Type'] = 'application/json';
    opciones.body = texto;
  }
  const t0 = performance.now();
  $('estado').className = 'badge text-bg-secondary';
  $('estado').textContent = '...';
  try {
    const r = await fetch($('url').value, opciones);
    const crudo = await r.text();
    let mostrado = crudo;
    try { mostrado = JSON.stringify(JSON.parse(crudo), null, 2); } catch (_) {}
    $('estado').className = 'badge ' + (r.ok ? 'text-bg-success' : 'text-bg-danger');
    $('estado').textContent = `${r.status} ${r.statusText}`;
    $('salida').textContent = mostrado || '(sin contenido)';
  } catch (err) {
    $('estado').className = 'badge text-bg-danger';
    $('estado').textContent = 'Error de red';
    $('salida').textContent = String(err);
  }
  $('tiempo').textContent = Math.round(performance.now() - t0) + ' ms';
});
</script>
{% endverbatim %}
</body>
</html>
