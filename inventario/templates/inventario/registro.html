{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear cuenta - CampesinoStock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'inventario/css/estilos.css' %}">
</head>
<body>
<div class="contenedor-principal">
    <div class="lado-izquierdo">
        <div class="logo-simple"><img src="{% static 'inventario/img/logo.png' %}" width="220"></div>
        <h2>Únete al sistema de<br>gestión de<br>Agroferretería El<br>Campesino</h2>
    </div>
    <div class="lado-derecho-form">
        <div class="form-container">
            <a href="{% url 'inicio' %}" class="volver">< Volver</a>
            <h3 class="titulo-form">Crear cuenta</h3>

            <form method="POST" autocomplete="off">
                {% csrf_token %}
                <label>Nombre</label>
                <input type="text" name="nombre" class="input-campo" placeholder="Karen" autocomplete="off" required>

                <label>Apellido</label>
                <input type="text" name="apellido" class="input-campo" placeholder="Ulloa" autocomplete="off" required>

                <label>Dirección</label>
                <input type="text" name="direccion" class="input-campo" placeholder="Calle principal" autocomplete="off" required>

                <label>Correo electrónico</label>
                <input type="email" name="correo" class="input-campo" placeholder="correo@ejemplo.com" autocomplete="off" required>

                <label>Teléfono</label>
                <input type="text" name="telefono" class="input-campo" placeholder="7000-0000" autocomplete="off" required>

                <label>Usuario</label>
                <input type="text" name="usuario" class="input-campo" placeholder="Karen10" autocomplete="off" required>

                <label>Contraseña</label>
                <input type="password" name="password" class="input-campo" placeholder="Mínimo 8 caracteres" autocomplete="new-password" required>

                <label>Confirmar contraseña</label>
                <input type="password" name="password2" class="input-campo" placeholder="Repite tu contraseña" autocomplete="new-password" required>

                <div class="terminos">
                    <input type="checkbox" required> 
                    <label>Acepto los <a href="{% url 'terminos' %}">términos y privacidad</a></label>
                </div>
                <button type="submit" class="btn-vino" style="margin-top:20px">Registrarse</button>
            </form>
            <p class="link-abajo">¿Ya tienes cuenta? <a href="{% url 'login' %}">Iniciar sesión</a></p>
        </div>
    </div>
</div>
</body>
</html>
