{% load static %}
<!DOCTYPE html>
<html>
<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
body{margin:0; background:#fdfbf7}
.izq{background:#5a1016; height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; color:white; text-align:center; position:sticky; top:0}
.btn-vino{background:#5a1016; color:white; border-radius:30px; padding:12px}
.campo{position:relative}.campo i{position:absolute; right:14px; top:50%; transform:translateY(-50%); cursor:pointer; color:#777}
.form-control{border-radius:12px; padding:10px}
.logo-box{background:white; padding:10px; border-radius:16px}
</style>
</head>
<body>
<div class="container-fluid"><div class="row">
<div class="col-md-6 izq">
  <div class="logo-box">
    <img src="{% static 'inventario/img/logo.png' %}" width="220" alt="Logo">
  </div>
  <h3 class="mt-4 fw-bold">Gestiona tu inventario<br>desde cualquier lugar</h3>
</div>
<div class="col-md-6 d-flex justify-content-center" style="padding:30px 0">
<div style="width:380px">
<a href="{% url 'login' %}" class="small text-muted text-decoration-none">< Volver</a>
<h3 class="fw-bold mt-2">Crear cuenta</h3>
<form method="POST" autocomplete="off" class="mt-3">
{% csrf_token %}
<label class="small fw-bold">Nombre *</label><input type="text" name="nombre" class="form-control mb-2" required>
<label class="small fw-bold">Apellido *</label><input type="text" name="apellido" class="form-control mb-2" required>
<label class="small fw-bold">Correo *</label><input type="text" id="correo_input" name="correo" class="form-control mb-2" required placeholder="ejemplo@correo.com">
<label class="small fw-bold">Teléfono *</label><input type="text" name="telefono" class="form-control mb-2" required placeholder="0000-0000">
<label class="small fw-bold">Dirección *</label><input type="text" name="direccion" class="form-control mb-2" required placeholder="Ej: Calle principal #123, frente a plaza">
<label class="small fw-bold">Usuario *</label><input type="text" id="usuario_input" name="usuario" class="form-control mb-2" required readonly style="background:#f3f3f3">
<small class="text-muted" style="font-size:11px; margin-top:-5px; display:block; margin-bottom:8px">Se genera automático desde tu correo</small>
<label class="small fw-bold">Contraseña *</label>
<div class="campo mb-2"><input type="password" id="p1" name="password" class="form-control" required><i class="bi bi-eye" onclick="ver('p1',this)"></i></div>
<label class="small fw-bold">Confirmar Contraseña *</label>
<div class="campo mb-3"><input type="password" id="p2" name="password2" class="form-control" required><i class="bi bi-eye" onclick="ver('p2',this)"></i></div>
<button class="btn btn-vino w-100">Crear cuenta</button>
</form>
</div>
</div>
</div></div>
<script>
function ver(id, icon){let input=document.getElementById(id); if(input.type==='password'){input.type='text'; icon.className='bi bi-eye-slash';} else {input.type='password'; icon.className='bi bi-eye';}}

document.getElementById('correo_input').addEventListener('input', function(){
  let email = this.value.trim();
  if(email.includes('@')){
    let user = email.split('@')[0].toLowerCase().replace(/[^a-z0-9._-]/g, '');
    document.getElementById('usuario_input').value = user;
  }
});
</script>
</body>
</html>
