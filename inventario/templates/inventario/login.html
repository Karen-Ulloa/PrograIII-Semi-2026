{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
body{margin:0; background:#fdfbf7}
.izq{background:#5a1016; height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; color:white; text-align:center}
.btn-vino{background:#5a1016; color:white; border-radius:30px; padding:12px}
.btn-vino:hover{background:#74151d; color:white}
.campo{position:relative}
.campo i{position:absolute; right:14px; top:50%; transform:translateY(-50%); cursor:pointer; color:#777}
.form-control{border-radius:12px; padding:12px}
.form-control:focus{border-color:#5a1016; box-shadow:0 0 0 .2rem rgba(90,16,22,.15)}
.logo-box{background:white; padding:10px; border-radius:16px}
</style>
</head>
<body>
<div class="container-fluid"><div class="row">
<div class="col-md-6 izq">
  <div class="logo-box">
    <img src="{% static 'inventario/img/logo.png' %}" width="220" alt="Logo">
  </div>
  <h3 class="mt-4 fw-bold">Gestiona tu inventario<br>desde cualquier lugar</h3>
</div>

<div class="col-md-6 d-flex align-items-center justify-content-center">
<div style="width:380px">
<a href="{% url 'inicio' %}" class="small text-muted text-decoration-none">&lt; Volver</a>
<h3 class="fw-bold mt-3">Iniciar sesión</h3>

{% if error %}<div class="alert alert-danger py-2 small mt-3">{{ error }}</div>{% endif %}

<form method="POST" action="{% url 'login' %}" class="mt-4">
{% csrf_token %}
<label class="small fw-bold" for="usuario_login">Correo o usuario *</label>
<input type="text" id="usuario_login" name="usuario" class="form-control mb-3" required autocomplete="username" autocapitalize="none">

<label class="small fw-bold" for="pass_login">Contraseña *</label>
<div class="campo mb-3">
  <input type="password" id="pass_login" name="password" class="form-control" required autocomplete="current-password">
  <i class="bi bi-eye" onclick="ver('pass_login', this)"></i>
</div>

<div class="d-flex justify-content-end mb-3">
  <a href="{% url 'recuperar' %}" style="color:#5a1016; font-size:13px; text-decoration:none; font-weight:600">¿Olvidaste tu contraseña?</a>
</div>

<button type="submit" class="btn btn-vino w-100 mt-2">Iniciar sesión</button>
</form>

<p class="small text-center mt-3">¿No tienes cuenta? <a href="{% url 'registro' %}" style="color:#5a1016" class="fw-bold">Regístrate</a></p>
</div>
</div>
</div></div>

<script>
function ver(id, icon){
  let input = document.getElementById(id);
  if(input.type === 'password'){ input.type = 'text'; icon.className = 'bi bi-eye-slash'; }
  else { input.type = 'password'; icon.className = 'bi bi-eye'; }
}
</script>
</body>
</html>
