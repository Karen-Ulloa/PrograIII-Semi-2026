{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión - CampesinoStock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'inventario/css/estilos.css' %}">
</head>
<body>
<div class="contenedor-principal">
    <div class="lado-izquierdo">
        <div class="logo-simple"><img src="{% static 'inventario/img/logo.png' %}" width="220" alt="logo"></div>
        <h2>Gestiona tu inventario<br>desde cualquier lugar</h2>
        <p style="font-size:11px; opacity:0.7; margin-top:15px">Agroferretería El Campesino</p>
    </div>
    <div class="lado-derecho-form">
        <div class="form-container">
            <a href="{% url 'inicio' %}" class="volver">< Volver</a>
            <h3 class="titulo-form">Iniciar sesión</h3>
            <form method="POST">{% csrf_token %}
                <label>Correo o usuario</label><input type="text" name="usuario" class="input-campo" placeholder="correo@ejemplo.com" required>
                <label>Contraseña</label><input type="password" name="password" class="input-campo" placeholder="Tu contraseña" required>
                <a href="{% url 'recuperar' %}" style="font-size:11px; color:#6b1c23;">¿Olvidaste tu contraseña?</a>
                <button type="submit" class="btn-vino" style="margin-top:20px">Iniciar sesión</button>
            </form>
            <p class="link-abajo">¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate</a></p>
        </div>
    </div>
</div>
</body>
</html>
