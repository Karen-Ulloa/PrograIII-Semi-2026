<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin permiso</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
body{background:#efece7}
.card{border-radius:16px; border:0; box-shadow:0 4px 18px rgba(0,0,0,.08)}
.btn-vino{background:#5a1016; color:white; border-radius:30px; padding:10px 24px}
.btn-vino:hover{background:#74151d; color:white}
</style>
</head>
<body>
<main class="container d-flex justify-content-center mt-5">
<section class="card p-5 text-center" style="width:440px; max-width:100%">
<i class="bi bi-shield-lock" style="font-size:48px; color:#5a1016"></i>
<h1 class="h4 mt-3">No tienes permiso</h1>
<p class="text-muted">Esta sección es solo para administradores.</p>
<a href="{% url 'dashboard' %}" class="btn btn-vino">Volver al inicio</a>
</section>
</main>
</body>
</html>
