<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<title>Restablecer contraseña</title>
<style>
body{background:#fdfbf7}
.card{border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.08);border:0}
.btn-vino{background:#5a1016;color:white;border-radius:30px;padding:10px}
.btn-vino:hover{background:#74151d;color:white}
a{color:#5a1016}
.form-control:focus{border-color:#5a1016;box-shadow:0 0 0 .2rem rgba(90,16,22,.15)}
.btn-ojo{background:white;border:1px solid #dee2e6;border-left:0;color:#6c757d}
.btn-ojo:hover{background:white;color:#5a1016}
.input-group .form-control{border-right:0}
</style>
</head>
<body>
<main class="container d-flex justify-content-center mt-5">
<section class="card p-4" style="width:420px;max-width:100%">
<a href="{% url 'login' %}" class="text-decoration-none">&lt; Volver</a>
<h1 class="h5 mt-3">Restablecer contraseña</h1>
<p class="small text-muted">Escribe tu nueva contraseña (mínimo 8 caracteres).</p>

<form method="POST" action="{% url 'restablecer' %}">{% csrf_token %}
<label class="small" for="password">Nueva contraseña</label>
<div class="input-group mt-1 mb-3">
<input id="password" type="password" name="password" class="form-control" required minlength="8" autocomplete="new-password">
<button class="btn btn-ojo" type="button" data-target="password" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button>
</div>

<label class="small" for="password2">Confirmar contraseña</label>
<div class="input-group mt-1 mb-3">
<input id="password2" type="password" name="password2" class="form-control" required minlength="8" autocomplete="new-password">
<button class="btn btn-ojo" type="button" data-target="password2" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button>
</div>

<button class="btn btn-vino w-100">Guardar contraseña</button>
</form>

{% if error %}<div class="alert alert-danger mt-3 mb-0">{{ error }}</div>{% endif %}
</section>
</main>

<script>
document.querySelectorAll('.btn-ojo').forEach(function(boton){
  boton.addEventListener('click', function(){
    var campo = document.getElementById(boton.dataset.target);
    var icono = boton.querySelector('i');
    if (campo.type === 'password') {
      campo.type = 'text';
      icono.className = 'bi bi-eye-slash';
    } else {
      campo.type = 'password';
      icono.className = 'bi bi-eye';
    }
  });
});
</script>
</body>
</html>
