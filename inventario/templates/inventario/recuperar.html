<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Recuperar contraseña</title>
<style>
body{background:#fdfbf7}
.card{border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.08);border:0}
.btn-vino{background:#5a1016;color:white;border-radius:30px;padding:10px}
.btn-vino:hover{background:#74151d;color:white}
a{color:#5a1016}
.nav-tabs .nav-link{color:#5a1016}
.nav-tabs .nav-link.active{color:#000;font-weight:500}
.form-control:focus{border-color:#5a1016;box-shadow:0 0 0 .2rem rgba(90,16,22,.15)}
</style>
</head>
<body>
<main class="container d-flex justify-content-center mt-5">
<section class="card p-4" style="width:420px;max-width:100%">
<a href="{% url 'login' %}" class="text-decoration-none">&lt; Volver</a>
<h1 class="h5 mt-3">Recuperar contraseña</h1>
<p class="small text-muted">Te enviaremos un código de verificación a tu correo registrado.</p>

<ul class="nav nav-tabs mb-3">
<li class="nav-item"><button class="nav-link {% if active_tab != 'telefono' %}active{% endif %}" data-bs-toggle="tab" data-bs-target="#tab-correo" type="button">Correo</button></li>
<li class="nav-item"><button class="nav-link {% if active_tab == 'telefono' %}active{% endif %}" data-bs-toggle="tab" data-bs-target="#tab-telefono" type="button">Teléfono</button></li>
</ul>

<div class="tab-content">
<div class="tab-pane {% if active_tab != 'telefono' %}active show{% endif %}" id="tab-correo">
<form method="POST" action="{% url 'recuperar' %}">{% csrf_token %}
<input type="hidden" name="tipo" value="correo">
<label class="small" for="input-correo">Correo registrado</label>
<input id="input-correo" type="email" name="correo" class="form-control mt-1 mb-3" required placeholder="ejemplo@correo.com">
<button class="btn btn-vino w-100">Enviar código</button>
</form>
</div>

<div class="tab-pane {% if active_tab == 'telefono' %}active show{% endif %}" id="tab-telefono">
<form method="POST" action="{% url 'recuperar' %}">{% csrf_token %}
<input type="hidden" name="tipo" value="telefono">
<label class="small" for="input-telefono">Teléfono registrado</label>
<input id="input-telefono" type="tel" name="telefono" class="form-control mt-1 mb-3" required placeholder="0000-0000">
<button class="btn btn-vino w-100">Enviar código</button>
</form>
</div>
</div>

{% if error %}<div class="alert alert-danger mt-3 mb-0">{{ error }}</div>{% endif %}
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
