{% load static %}
<!DOCTYPE html>
<html>
<head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#fdfbf7}.card{border-radius:16px}.btn-vino{background:#5a1016; color:white; border-radius:30px}</style>
</head>
<body>
<div class="container d-flex justify-content-center mt-5"><div class="card p-4" style="width:420px">
<a href="{% url 'login' %}">< Volver</a>
<h5 class="mt-3">Recuperar contraseña</h5>
<p class="small text-muted">Elige cómo quieres recuperar</p>

<ul class="nav nav-tabs mb-3"><li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#correo">Correo</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#telefono">Teléfono</button></li></ul>

<div class="tab-content">
<div class="tab-pane active" id="correo">
<form method="POST"><input type="hidden" name="tipo" value="correo">{% csrf_token %}
<label class="small">Correo registrado</label>
<input type="text" name="correo" class="form-control mb-3" required placeholder="ejemplo@correo.com">
<button class="btn btn-vino w-100">Enviar código a mi correo</button>
</form>
</div>
<div class="tab-pane" id="telefono">
<form method="POST"><input type="hidden" name="tipo" value="telefono">{% csrf_token %}
<label class="small">Teléfono registrado</label>
<input type="text" name="telefono" class="form-control mb-3" required placeholder="0000-0000">
<button class="btn btn-vino w-100">Enviar código a mi teléfono</button>
</form>
</div>
</div>
{% if mensaje %}<div class="alert alert-success mt-3">{{mensaje}}</div>{% endif %}
{% if error %}<div class="alert alert-danger mt-3">{{error}}</div>{% endif %}
</div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
