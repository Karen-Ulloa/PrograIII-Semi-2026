{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar contraseña - CampesinoStock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'inventario/css/estilos.css' %}">
</head>
<body>
<div class="contenedor-principal">
    <div class="lado-izquierdo">
        <div class="logo-simple"><img src="{% static 'inventario/img/logo.png' %}" width="220"></div>
        <h2>¿Olvidaste tu<br>contraseña?</h2>
        <p style="font-size:11px; opacity:0.7; margin-top:15px">No te preocupes, te enviaremos instrucciones</p>
    </div>
    <div class="lado-derecho-form">
        <div class="form-container">
            <a href="{% url 'login' %}" class="volver">< Volver al login</a>
            <h3 class="titulo-form">Recuperar contraseña</h3>
            <p style="font-size:12px; color:#666; margin-bottom:20px">Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.</p>
            <form method="POST">{% csrf_token %}
                <label>Correo electrónico</label>
                <input type="email" name="correo" class="input-campo" placeholder="correo@ejemplo.com" required>
                <button type="submit" class="btn-vino" style="margin-top:20px">Enviar enlace</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
